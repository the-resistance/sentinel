name: Native C
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential clang libsqlite3-dev libhackrf-dev time
      - run: make test CC=${{ matrix.compiler }}
      - run: make sanitize CC=${{ matrix.compiler }}
      - run: make test BACKEND=offline CC=${{ matrix.compiler }}
      - run: make package CC=${{ matrix.compiler }}
      - name: Verify extracted executable bundle
        run: |
          mkdir -p runtime/bundle-check
          tar -xzf dist/sentinel-linux-x86_64.tar.gz -C runtime/bundle-check
          cd runtime/bundle-check
          sha256sum -c dist/SHA256SUMS
          bash tests/run-suite.sh ../ci-qualification
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-linux-x86_64-${{ matrix.compiler }}
          path: |
            dist/*.tar.gz
            runtime/ci-qualification
          retention-days: 14
