name: Native C
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential clang libsqlite3-dev libhackrf-dev
      - run: make test CC=${{ matrix.compiler }}
      - run: make sanitize CC=${{ matrix.compiler }}
      - run: make test BACKEND=offline CC=${{ matrix.compiler }}
